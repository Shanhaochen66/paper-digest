# 农业遥感论文每日推送 - GitHub Actions 定时任务
# 每天 UTC 00:00（北京时间 08:00）自动运行

name: Daily Paper Digest

on:
  schedule:
    # 每天 UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * *'
  # 允许手动触发
  workflow_dispatch:

# 授予写入权限，以便推送 sent_papers.json 更新
permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: paper_digest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate config from Secrets
        run: |
          cp config.example.yaml config.yaml
          python -c "
          import yaml
          with open('config.yaml', 'r') as f:
              cfg = yaml.safe_load(f)
          cfg['email']['sender'] = '${{ secrets.EMAIL_SENDER }}'
          cfg['email']['password'] = '${{ secrets.EMAIL_PASSWORD }}'
          cfg['email']['recipients'] = '${{ secrets.EMAIL_RECIPIENTS }}'.split(',')
          cfg['deepseek'] = {'api_key': '${{ secrets.DEEPSEEK_API_KEY }}', 'model': 'deepseek-chat'}
          with open('config.yaml', 'w') as f:
              yaml.dump(cfg, f, allow_unicode=True)
          print('config.yaml 已生成')
          "

      - name: Run daily digest
        run: python main.py

      - name: Commit sent papers update
        if: success()
        run: |
          git config user.name "paper-digest-bot"
          git config user.email "bot@paper-digest.local"
          git add sent_papers.json journals_if.json
          git diff --cached --quiet || (
            git commit -m "📝 Update sent papers & journal cache [$(date +%Y-%m-%d)]"
            git push
          )
